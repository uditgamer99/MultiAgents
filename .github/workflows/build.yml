name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Optional: use your real Firebase config instead of the placeholder
      # committed in the repo. Add a repo secret named
      # GOOGLE_SERVICES_JSON_BASE64 containing `base64 google-services.json`
      # (Settings -> Secrets and variables -> Actions). Safe to skip — the
      # build still succeeds with the placeholder, it just won't reach
      # your real Firebase project at runtime.
      - name: Inject real google-services.json if provided
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
            echo "Using google-services.json from repo secret."
          else
            echo "No secret set — building with the placeholder google-services.json."
          fi

      - name: Build release APK
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: flutter build apk --release --dart-define=GROQ_API_KEY="$GROQ_API_KEY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: duo-ai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
