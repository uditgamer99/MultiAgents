name: duo_ai
description: "DUO AI — Personal AI Operating System"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # UI
  cupertino_icons: ^1.0.8

  # Utils
  equatable: ^2.0.5

  # Networking (Groq API)
  http: ^1.2.2

  # Exporting generated code files (copy + Android share sheet)
  share_plus: ^11.0.0
  path_provider: ^2.1.4

  # Local chat session metadata (title, pinned, timestamps)
  shared_preferences: ^2.3.2

  # Attachment system (Part 8A): picking files from device storage
  # and determining their MIME type. Neither reads file contents for
  # analysis — that's Part 8B.
  file_picker: ^8.1.4
  mime: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
